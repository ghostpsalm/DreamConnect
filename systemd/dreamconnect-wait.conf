# systemd drop-in for the ScreenConnect client unit, BACKSTAGE installs only.
# Installed by install.sh beside dreamconnect.conf at
#   /etc/systemd/system/connectwisecontrol-<id>.service.d/dreamconnect-wait.conf
#
# Holds ScreenConnect's start until the backstage session can be attached to:
# its frame exists, its daemon answers PING, its display env file is published
# and root has registered it (#102). On boot the client unit used to start a
# minute before the DreamConnect daemons, so its JVM came up with no DISPLAY
# and resolved its session before there was a frame to attach to, and it
# showed nothing until somebody restarted it.
#
# Why this reaches the env file: systemd reads EnvironmentFile= (in
# dreamconnect.conf) as it spawns each command, so ExecStart sees the file the
# backstage shell wrote during this wait, not the absence it found before.
#
# `-`: the wait never fails the unit. A bridge that does not come up within
# --timeout is logged and ScreenConnect starts anyway, because a broken bridge
# must not also take away the operator's remote way in.
#
# Not installed for a classic (attended) install: there the daemon comes up
# only when somebody logs in, so every boot would sit out the whole timeout.
#
# TimeoutStartSec= is the whole start, ExecStartPre included, so it must exceed
# --timeout with room for ScreenConnect's own start; test_install.sh holds it
# to that, reading both numbers from this file.
[Service]
ExecStartPre=-/usr/bin/python3 @INSTALL_DIR@/runtime/dreamconnect_wait_ready.py --uid @UID@ --shm @SHM_PATH@ --socket /run/user/@UID@/dreamconnect.sock --display-env /run/user/@UID@/dreamconnect-display.env --registry /run/dreamconnect/sessions --timeout 150
TimeoutStartSec=300
