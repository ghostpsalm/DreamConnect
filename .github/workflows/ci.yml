name: gate

# Runs the repo gate (./run-tests.sh) on every PR and on pushes to main, so a
# green tick actually means the Java boot tests, the Python daemon tests, and
# the installer shell tests all passed. Before this, nothing verified a PR —
# branches merged UNVERIFIED. Keep this in step with run-tests.sh's needs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BootTests compiles agent/boot + agent/test and needs java.desktop
      # internals (--add-exports in run-tests.sh); a full JDK provides them.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runtime/dreamconnect_daemon.py imports gi + requires the Gst 1.0
      # typelib at module load, so test_daemon.py can't import without them.
      - name: Install PyGObject + GStreamer introspection
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-glib-2.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base

      - name: Gate
        run: |
          set -o pipefail
          ./run-tests.sh 2>&1 | tee "$RUNNER_TEMP/gate.log"

      # factory/config.json's gate_accepted_skips are checks a confined Factory gate cannot run
      # (they need sudo; the #27 sticky-bit reproductions). Accepting them there is only honest
      # while they run somewhere: this runner has passwordless sudo, so each must have run and
      # passed here, by its exact name -- skipped, renamed or missing is red.
      - name: Accepted skips ran here
        run: |
          python3 - "$RUNNER_TEMP/gate.log" <<'PY'
          import json, sys
          log = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          accepted = json.load(open("factory/config.json")).get("gate_accepted_skips", [])
          bad = []
          for leg in accepted:
              case = leg.split(" :: : ", 1)[-1]
              if f"ok  : {case}" not in log:
                  bad.append(leg)
          for leg in bad:
              print(f"accepted skip did not run and pass in CI: {leg}")
          print(f"{len(accepted) - len(bad)} of {len(accepted)} accepted skips ran and passed")
          sys.exit(1 if bad else 0)
          PY
